name: make check

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: make check
        run: make check
        env:
          # empty when unset (e.g. fork PRs), so the Makefile falls back to its default RPC
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
