# Enforce brace style only — all other options at default (ignore)

# indentation style (4 spaces)
indent_with_tabs = 0
indent_columns   = 4

# Add braces to braceless single-line control blocks
mod_full_brace_if    = add
mod_full_brace_for   = add
mod_full_brace_while = add
mod_full_brace_do    = add

# Ensure the body is on its own line (not inlined after the opening brace)
nl_after_brace_open     = true

# Don't expand one-line braced assignments/initializers, as in 'x = { 1, 2 };'
nl_assign_leave_one_liners = true

# Space between closing ) of condition and opening {
sp_sparen_brace         = add

# Space between else/catch and opening {
sp_else_brace           = add

# One statement per line (splits 'a = 1; b = 2;' and struct members)
nl_after_semicolon = true

# Align closing ) with the statement, not the arguments
indent_paren_close = -1

# Use fixed indent for multi-line function call arguments, not paren-aligned
indent_func_call_param = false

# Don't reflow/reindent the interior of multi-line comments (preserves
# hand-indented code in commented-out blocks)
cmt_indent_multi = false
